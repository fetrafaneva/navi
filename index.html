<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Navi — Préview Avatar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/avatar.css" />
    <link rel="stylesheet" href="css/bubble.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body>
    <!-- Étoiles de fond -->
    <div class="stars" id="stars"></div>

    <div class="scene">
      <h1>✨ Navi</h1>
      <p class="subtitle">Préview — Assistant anime Phase 3</p>

      <div class="preview-card">
        <!-- Bulle de dialogue -->
        <div class="dialog-bubble" id="bubble">
          <p id="bubble-text">Salut ! Je suis Navi~ ✨</p>
        </div>

        <!-- Avatar -->
        <div class="avatar waving" id="avatar" onclick="handleClick()">
          <div class="avatar__shadow"></div>
          <div class="character" id="character">
            <div class="hair-back"></div>
            <div class="body">
              <div class="collar"></div>
              <div class="bow"></div>
              <div class="arm left"></div>
              <div class="arm right" id="arm-right"></div>
            </div>
            <div class="head">
              <div class="hair-top"></div>
              <div class="hair-side left"></div>
              <div class="hair-side right"></div>
              <div class="hair-bang bl"></div>
              <div class="hair-bang br"></div>
              <div class="hair-bang center"></div>
              <div class="face">
                <div class="eyes">
                  <div class="eye">
                    <div class="eye-white">
                      <div class="eye-iris"></div>
                      <div class="eye-pupil"></div>
                      <div class="eye-shine"></div>
                    </div>
                    <div class="eyelash"></div>
                  </div>
                  <div class="eye">
                    <div class="eye-white">
                      <div class="eye-iris"></div>
                      <div class="eye-pupil"></div>
                      <div class="eye-shine"></div>
                    </div>
                    <div class="eyelash"></div>
                  </div>
                </div>
                <div class="nose"></div>
                <div class="mouth" id="mouth"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
              </div>
              <div class="ear left"></div>
              <div class="ear right"></div>
            </div>
            <div class="star-acc">★</div>
            <div class="legs">
              <div class="leg"><div class="shoe"></div></div>
              <div class="leg"><div class="shoe"></div></div>
            </div>
          </div>
          <div class="particles" id="particles"></div>
        </div>

        <!-- 🆕 Zone de saisie Phase 3 -->
        <div class="input-bar">
          <input
            type="text"
            id="user-input"
            class="input-bar__field"
            placeholder="Parle à Navi..."
            maxlength="200"
            onkeydown="if(event.key==='Enter') sendMessage()"
          />
          <button class="input-bar__btn" onclick="sendMessage()">➤</button>
          <button
            class="input-bar__btn reset"
            onclick="resetChat()"
            title="Nouvelle conversation"
          >
            ↺
          </button>
        </div>

        <!-- Boutons états -->
        <div class="controls">
          <button
            class="btn btn-waving"
            onclick="setState('waving',  'Coucou ! 👋')"
          >
            Saluer
          </button>
          <button
            class="btn btn-talking"
            onclick="setState('talking', 'Je traite ta demande... 💬')"
          >
            Parler
          </button>
          <button
            class="btn btn-happy"
            onclick="setState('happy',   'Yaaay ! ✨🎉')"
          >
            Joyeux
          </button>
          <button
            class="btn btn-think"
            onclick="setState('thinking','Hmm... 🤔')"
          >
            Réfléchir
          </button>
          <button
            class="btn btn-idle"
            onclick="setState('idle',    'Je veille sur toi~ 💤')"
          >
            Idle
          </button>
        </div>

        <p class="info">
          💬 Tape un message pour parler à Navi via Claude AI !
        </p>
      </div>
    </div>

    <!-- Bouton reset conversation -->
    <button
      class="config-btn"
      onclick="resetChat()"
      title="Nouvelle conversation"
    >
      ↺
    </button>

    <!-- Scripts dans le bon ordre -->
    <script src="js/stars.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/avatar.js"></script>
    <script>
      // Envoie un message à Claude
      async function sendMessage() {
        const input = document.getElementById("user-input");
        const text = input.value.trim();
        if (!text || ClaudeService.isBusy) return;

        input.value = "";
        input.disabled = true;

        await ClaudeService.ask(
          text,
          () => setState("thinking", "Hmm, laisse-moi réfléchir... 🤔"),
          (reply) => {
            input.disabled = false;
            input.focus();
            setState("talking", reply);
          }
        );
      }

      // Reset la conversation
      function resetChat() {
        ClaudeService.clearHistory();
        setState("happy", "Nouvelle conversation ! 😊");
      }
    </script>
  </body>
</html>
